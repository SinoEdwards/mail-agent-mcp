# Dependabot keeps dependencies current and patches security advisories.
# Security updates are always raised regardless of the schedule below.
#
# Minor/patch updates are grouped into one PR. Major updates are raised as
# individual PRs for manual review. No auto-merge workflow is configured.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # One bundled PR for minor/patch updates (production and development).
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # undici 8 raises the runtime floor beyond this project's Node >=22.12 contract.
      - dependency-name: "undici"
        update-types:
          - "version-update:semver-major"
    # Major bumps are intentionally NOT grouped → separate PRs, manual review.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

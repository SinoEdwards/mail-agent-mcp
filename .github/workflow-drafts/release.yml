name: Disabled release validation draft

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_TAG: v0.1.1

jobs:
  validate:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Check generated diff
        run: git diff --check
      - name: Secret-free static checks
        run: npm run check:secrets
      - name: Package dry run
        run: npm pack --dry-run
      - name: Validate identity, version, and tag
        shell: bash
        run: >
          node -e "const p=require('./package.json'),l=require('./package-lock.json'),t=process.env.RELEASE_TAG;
          if(p.name!=='mail-agent-mcp'||p.version!=='0.1.1'||l.name!==p.name||l.version!==p.version||
          !/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(t)||t.slice(1)!==p.version) process.exit(1)"
      - name: Validate release artifacts
        shell: bash
        run: |
          test -f dist/index.js
          test -f dist/setup.js

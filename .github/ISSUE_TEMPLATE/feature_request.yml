name: Feature request
description: Propose a focused provider, MCP, or safety improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or agent workflow that is currently difficult.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include the MCP permission and read/write boundary.
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider scope
      options:
        - Provider-independent
        - Gmail
        - QQ Mail
        - Generic IMAP/SMTP
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and compatibility considerations
      description: Explain credential, confirmation, mailbox-mutation, and migration effects.
    validations:
      required: true
